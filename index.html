<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Судоку Мастер</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
      touch-action: none;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
    }
    #buttons-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .ad-button {
      pointer-events: auto;
      width: 260px;
      height: 70px;
      margin: 15px 0;
      border-radius: 35px;
      border: 3px solid;
      background: rgba(26, 26, 46, 0.95);
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }
    .ad-button:active {
      transform: scale(0.95);
    }
    #b1 {
      color: #00ff88;
      border-color: #00ff88;
    }
    #b2 {
      color: #00aaff;
      border-color: #00aaff;
    }
    #status-text {
      color: #aaaaaa;
      font-family: Arial, sans-serif;
      font-size: 14px;
      text-align: center;
      margin-top: 30px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="buttons-overlay">
      <button id="b1" class="ad-button" aria-label="b1 rewarded">B1: REWARDED</button>
      <button id="b2" class="ad-button" aria-label="b2 interstitial">B2: INTERSTITIAL</button>
      <div id="status-text">Инициализация...</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
